function gSt(){if(!GS.id)return'Не подключено. Нужен Client ID (см. инструкцию).';if(gMsg)return gMsg;return GS.on?'Подключено. Нажмите «Синхронизировать», если вход истёк.':'Client ID указан. Нажмите «Синхронизировать» и войдите в Google.'}
function gLib(){return new Promise((ok,no)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();const x=document.createElement('script');x.src='https://accounts.google.com/gsi/client';x.onload=()=>ok();x.onerror=()=>no(new Error('не удалось загрузить скрипт Google'));document.head.append(x)})}
function gAuth(){return gLib().then(()=>new Promise((ok,no)=>{if(gOk())return ok();
const tc=google.accounts.oauth2.initTokenClient({client_id:GS.id,scope:'https://www.googleapis.com/auth/calendar.events',callback:r=>{if(r.error)return no(new Error(r.error));gTok=r.access_token;gExp=Date.now()+r.expires_in*1000;ok()},error_callback:e=>no(new Error(e.type||'вход отменён'))});
tc.requestAccessToken({prompt:GS.on?'':'consent'})}))}
async function gf(u,o){const r=await fetch(u,Object.assign({headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json'}},o));if(r.status==204||r.status==404||r.status==410)return{};if(r.status==401){gTok=null;throw new Error('нужен повторный вход')}if(!r.ok)throw new Error('Google '+r.status);return r.json()}
function gSched(){if(!GS.on||!gOk())return;clearTimeout(gT);gT=setTimeout(()=>gSync(0),1500)}
async function gSync(){if(!GS.id||gBusy)return;gBusy=1;gMsg='Синхронизация…';gUi();
try{await gAuth();
for(const g of(CAL.del||[]))await gf(GA+'/'+g,{method:'DELETE'});CAL.del=[];
const now=new Date(),a=new Date(now.getFullYear(),now.getMonth()-6,1),b=new Date(now.getFullYear()+1,now.getMonth()+1,1);let it=[],pt='';
do{const j=await gf(GA+'?singleEvents=true&maxResults=250&timeMin='+encodeURIComponent(a.toISOString())+'&timeMax='+encodeURIComponent(b.toISOString())+(pt?'&pageToken='+pt:''));it=it.concat(j.items||[]);pt=j.nextPageToken}while(pt);
const byG={},byI={},used={},wa=ymd(a),wb=ymd(b);
it.forEach(e=>{byG[e.id]=e;const i=e.extendedProperties&&e.extendedProperties.private&&e.extendedProperties.private.egeId;if(i)byI[i]=e});
const ds=e=>e.start?(e.start.date||(e.start.dateTime||'').slice(0,10)):'';
const pull=(t,e)=>{const m=e.summary||'';t.done=/^✓/.test(m);t.t=m.replace(/^✓\s*/,'')||'(без названия)';t.d=ds(e)||t.d;t.gid=e.id;t.sy=e.updated;t.dirty=0};
for(const t of CAL.tasks.slice()){const e=(t.gid&&byG[t.gid])||byI[t.id];
 if(e){used[e.id]=1;if(!t.sy||e.updated!==t.sy)pull(t,e);else if(t.dirty){const r=await gf(GA+'/'+e.id,{method:'PATCH',body:JSON.stringify({summary:(t.done?'✓ ':'')+t.t})});if(r.updated){t.sy=r.updated;t.dirty=0}}}
 else if(t.gid){if(t.d>=wa&&t.d<=wb){const i=CAL.tasks.indexOf(t);if(i>=0)CAL.tasks.splice(i,1)}}
 else{const n=calDT(t.d);n.setDate(n.getDate()+1);const r=await gf(GA,{method:'POST',body:JSON.stringify({summary:(t.done?'✓ ':'')+t.t,start:{date:t.d},end:{date:ymd(n)},extendedProperties:{private:{egeId:t.id}}})});if(r.id){t.gid=r.id;t.sy=r.updated;t.dirty=0}}}
it.forEach(e=>{if(used[e.id]||e.status=='cancelled'||!ds(e))return;const t={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:'',t:'',done:false};pull(t,e);CAL.tasks.push(t)});
GS.on=1;gSv();calPut();gMsg='Синхронизировано в '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
catch(e){gMsg='Ошибка: '+e.message}
gBusy=0;if(document.body.classList.contains('calv'))calRender();else gUi()}
setInterval(()=>{if(GS.on&&gOk()&&document.body.classList.contains('calv'))gSync()},300000);
function gPanel(mk,bt){const p=mk('div','cpn');p.append(mk('h3','','Google Календарь'));const st=mk('div','cem',gSt());st.id='gst';p.append(st);
const r=mk('div','cad');r.style.flexWrap='wrap';
r.append(bt('','','Client ID…',()=>{const v=prompt('Google OAuth Client ID',GS.id);if(v!==null){GS.id=v.trim();GS.on=0;gTok=null;gMsg='';gSv();calRender()}}));
if(GS.id)r.append(bt('','','Синхронизировать',()=>gSync()));
if(GS.on)r.append(bt('','','Отключить',()=>{GS.on=0;gTok=null;gMsg='';gSv();calRender()}));
p.append(r);return p}
document.execCommand('defaultParagraphSeparator',false,'p');
show();setMode(false);
</script></body></html>
